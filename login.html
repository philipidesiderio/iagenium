<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IaGenium - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-gray-900 p-8 rounded-2xl border border-gray-800 shadow-2xl">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-robot text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">
                    IaGenium
                </h1>
                <p class="text-gray-400 mt-2">Acesse sua conta para gerenciar seus chatbots</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                    <input type="email" id="email" required 
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                           placeholder="seu@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Senha</label>
                    <input type="password" id="password" required 
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                           placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-cyan-600 bg-gray-800 border-gray-600 rounded focus:ring-cyan-500">
                        <span class="ml-2 text-sm text-gray-300">Lembrar de mim</span>
                    </label>
                    <a href="#" class="text-sm text-cyan-400 hover:text-cyan-300">Esqueceu a senha?</a>
                </div>

                <button type="submit" 
                        class="w-full bg-gradient-to-r from-cyan-600 to-purple-600 text-white py-3 px-4 rounded-lg font-medium hover:from-cyan-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Acessar Dashboard
                </button>
            </form>

            <!-- Alternative Login -->
            <div class="mt-6 pt-6 border-t border-gray-800">
                <button onclick="loginWithTypebot()" 
                        class="w-full bg-gray-800 text-white py-3 px-4 rounded-lg font-medium hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-600 transition-colors">
                    <i class="fab fa-github mr-2"></i>
                    Continuar com Typebot
                </button>
            </div>

            <!-- Register Link -->
            <div class="text-center mt-6">
                <p class="text-gray-400">
                    Não tem uma conta? 
                    <a href="index.html#pricing" class="text-cyan-400 hover:text-cyan-300 font-medium">Assine um plano</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simulate login validation
            if (email && password) {
                // Store login state
                localStorage.setItem('iagenium_logged_in', 'true');
                localStorage.setItem('iagenium_user', email);
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                alert('Por favor, preencha todos os campos.');
            }
        });

        function loginWithTypebot() {
            // Redirect to original typebot login but return to our dashboard
            window.location.href = 'https://admin.iagenium.shop/pt-BR/signin';
        }

        // Check if already logged in
        if (localStorage.getItem('iagenium_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
